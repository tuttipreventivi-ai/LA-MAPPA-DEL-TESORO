<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>RDR2 Map - Tropys</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #1a1412;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Configuración de coordenadas planas para el mapa del juego
        var map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -1,
            maxZoom: 3,
            zoomControl: false
        });

        // Controles de zoom abajo a la derecha
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Dimensiones de la imagen del mapa
        var bounds = [[0, 0], [4096, 4096]];

        // Usamos una URL directa y estable de la imagen del mapa completo de RDR2
        var imageUrl = 'https://images.igdb.com/igdb/image/upload/t_original/grm4w6.jpg';

        // Añadimos la imagen como una capa interactiva en el mapa
        L.imageOverlay(imageUrl, bounds).addTo(map);

        // Ajustamos los límites y la vista inicial al centro del mapa
        map.setMaxBounds([[-1000, -1000], [5096, 5096]]);
        map.setView([2048, 2048], 0);

        // Marcador de prueba en Valentine / zona central
        L.marker([2048, 2048]).addTo(map)
            .bindPopup('<b>¡Tropys RDR2 Map!</b><br>¡Mapa cargado con éxito!');
    </script>
</body>
</html>
