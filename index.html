<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LA MAPPA DEL TESORO</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Georgia', serif; background-color: #12100e; color: #f4e8c1; }
        
        /* Intestazione overlay */
        header {
            position: absolute;
            top: 0; left: 0; right: 0;
            z-index: 100;
            background: rgba(30, 25, 20, 0.88);
            backdrop-filter: blur(5px);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #8b5a2b;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        h1 { font-size: 1.5rem; color: #d4af37; text-shadow: 1px 1px 3px #000; letter-spacing: 2px; }
        .controls { display: flex; gap: 10px; align-items: center; }
        button {
            background: #3a3025;
            color: #d4af37;
            border: 1px solid #8b5a2b;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        button:hover { background: #524434; color: #fff; }
        
        /* Area Visualizzazione Mappa */
        #viewport {
            width: 100vw;
            height: 100vh;
            position: relative;
            cursor: grab;
            overflow: hidden;
            background: #1a1612;
        }
        #viewport:active { cursor: grabbing; }

        #map-container {
            position: absolute;
            transform-origin: 0 0;
            user-select: none;
        }

        #map-img {
            display: block;
            pointer-events: none;
            max-width: none;
        }

        /* Marker dei Tesori */
        .marker {
            position: absolute;
            width: 22px;
            height: 22px;
            background: radial-gradient(circle, #ffea00 0%, #d4af37 60%, #8b5a2b 100%);
            border: 2px solid #ffffff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 234, 0, 0.8), 0 2px 5px rgba(0,0,0,0.8);
            z-index: 10;
            transition: transform 0.15s ease;
        }
        .marker:hover {
            transform: translate(-50%, -50%) scale(1.35);
            z-index: 20;
            background: #ffffff;
            border-color: #ffd700;
        }

        /* Finestra Modale per Dettagli/Inserimento */
        .modal {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 200;
            background: #2b251f;
            border: 2px solid #8b5a2b;
            border-radius: 8px;
            padding: 20px;
            width: 320px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .modal h2 { color: #d4af37; margin-bottom: 12px; font-size: 1.2rem; border-bottom: 1px solid #524434; padding-bottom: 5px; }
        .modal input, .modal textarea {
            width: 100%;
            background: #1a1612;
            border: 1px solid #8b5a2b;
            color: #f4e8c1;
            padding: 8px;
            margin-bottom: 12px;
            border-radius: 4px;
            font-family: inherit;
        }
        .modal-buttons { display: flex; justify-content: space-between; margin-top: 5px; }
        .btn-danger { background: #8b2b2b; border-color: #a53a3a; color: #fff; }
        .btn-danger:hover { background: #a53a3a; }

        .instructions {
            position: absolute;
            bottom: 15px; left: 15px;
            z-index: 100;
            background: rgba(30, 25, 20, 0.85);
            padding: 8px 14px;
            border-radius: 4px;
            font-size: 0.85rem;
            border: 1px solid #8b5a2b;
            pointer-events: none;
            color: #d4af37;
        }
    </style>
</head>
<body>

    <header>
        <h1>LA MAPPA DEL TESORO</h1>
        <div class="controls">
            <button onclick="zoomIn()">Zoom +</button>
            <button onclick="zoomOut()">Zoom -</button>
            <button onclick="resetView()">Reset</button>
        </div>
    </header>

    <div class="instructions">
        🔍 Trascina per spostarti | Rotella per Zoom | Clicca sulla mappa per aggiungere un tesoro
    </div>

    <div id="viewport">
        <div id="map-container">
            <img id="map-img" src="mappa_REd.jpg" alt="Mappa del Tesoro" onload="initMap()">
            <div id="markers-layer"></div>
        </div>
    </div>

    <!-- Modale Inserimento/Modifica -->
    <div id="marker-modal" class="modal">
        <h2 id="modal-title">Dettagli Tesoro</h2>
        <input type="text" id="point-title" placeholder="Nome del punto/tesoro">
        <textarea id="point-desc" rows="3" placeholder="Fonti o note sul punto..."></textarea>
        <div class="modal-buttons">
            <button class="btn-danger" id="btn-delete" onclick="deleteCurrentMarker()">Elimina</button>
            <div>
                <button onclick="closeModal()">Annulla</button>
                <button onclick="saveMarker()">Salva</button>
            </div>
        </div>
    </div>

    <script>
        let scale = 1;
        let panX = 0;
        let panY = 0;
        let isDragging = false;
        let startX, startY;
        let activeMarkerIndex = null;
        let pendingClickPos = null;

        const viewport = document.getElementById('viewport');
        const container = document.getElementById('map-container');
        const markersLayer = document.getElementById('markers-layer');

        // Punti iniziali dalle fonti
        let points = [
            { id: 1, x: 220, y: 298, name: "Nekoti Rock / Cochinay", desc: "Fonti 10.png, 45.png" },
            { id: 2, x: 260, y: 238, name: "Upper Montana River / Fort Riggs", desc: "Fonti 1_1.png, 2.png, 39.jpg, 45.png" },
            { id: 3, x: 310, y: 233, name: "Riggs Station / Lone Mule Stead", desc: "Fonti 11.png, 12.png, 13.png, 14.png, 42.png, 44.png, 46.jpg, 47.jpg, 49.jpg" },
            { id: 4, x: 345, y: 238, name: "Bard's Crossing / Dakota River", desc: "Fonti 15.png, 16.png, 21.png, 48.jpg" },
            { id: 5, x: 365, y: 273, name: "Painted Sky / Limpany", desc: "Fonti 17.png, 18.png, 19.png, 20.png, 35.png" },
            { id: 6, x: 355, y: 208, name: "Flatneck Station / Gill Landing", desc: "Fonti 22.png, 23.png, 24.png, 25.png, 43.png" },
            { id: 7, x: 390, y: 303, name: "Heartlands / Citadel Rock", desc: "Fonti 32.png, 33.png, 34.png" },
            { id: 8, x: 440, y: 213, name: "Scarlett Meadows / Eris Field", desc: "Fonti 26.png, 27.png, 28.png, 38.png" },
            { id: 9, x: 510, y: 253, name: "Bluewater Marsh / Lagras", desc: "Fonti 29.png, 30.png, 31.png, 37.png, 41.png" },
            { id: 10, x: 280, y: 178, name: "Great Plains / Quaker's Cove", desc: "Fonti 3.png, 4.png, 5.png, 6.png, 7.png, 40.jpg" },
            { id: 11, x: 230, y: 158, name: "Tall Trees / Lower Montana River", desc: "Fonti 8.png, 9.png" }
        ];

        // Recupera eventuali modifiche salvate localmente
        const saved = localStorage.getItem('mappa_tesori_points');
        if (saved) {
            try { points = JSON.parse(saved); } catch(e){}
        }

        function initMap() {
            resetView();
            renderMarkers();
        }

        function updateTransform() {
            container.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        }

        function zoomIn() {
            scale = Math.min(scale * 1.3, 5);
            updateTransform();
        }

        function zoomOut() {
            scale = Math.max(scale / 1.3, 0.4);
            updateTransform();
        }

        function resetView() {
            const img = document.getElementById('map-img');
            scale = Math.min(window.innerWidth / img.naturalWidth, window.innerHeight / img.naturalHeight) * 0.95;
            if(!scale || isNaN(scale)) scale = 1.2;
            panX = (window.innerWidth - img.naturalWidth * scale) / 2;
            panY = (window.innerHeight - img.naturalHeight * scale) / 2;
            updateTransform();
        }

        // Gestione Drag
        viewport.addEventListener('mousedown', (e) => {
            if (e.target.classList.contains('marker') || e.target.closest('.modal')) return;
            isDragging = true;
            startX = e.clientX - panX;
            startY = e.clientY - panY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            panX = e.clientX - startX;
            panY = e.clientY - startY;
            updateTransform();
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        // Zoom con Rotella Mouse
        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = e.deltaY < 0 ? 1.15 : 0.85;
            const newScale = Math.min(Math.max(0.4, scale * zoomFactor), 6);
            
            const rect = viewport.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            panX = mouseX - (mouseX - panX) * (newScale / scale);
            panY = mouseY - (mouseY - panY) * (newScale / scale);
            scale = newScale;

            updateTransform();
        }, { passive: false });

        // Inserimento nuovi punti
        viewport.addEventListener('click', (e) => {
            if (e.target.classList.contains('marker') || e.target.closest('.modal') || e.target.closest('header')) return;
            
            const rect = container.getBoundingClientRect();
            const clickX = (e.clientX - rect.left) / scale;
            const clickY = (e.clientY - rect.top) / scale;

            pendingClickPos = { x: Math.round(clickX), y: Math.round(clickY) };
            activeMarkerIndex = null;

            document.getElementById('modal-title').innerText = "Nuovo Tesoro";
            document.getElementById('point-title').value = "";
            document.getElementById('point-desc').value = "";
            document.getElementById('btn-delete').style.display = "none";
            document.getElementById('marker-modal').style.display = "block";
        });

        function renderMarkers() {
            markersLayer.innerHTML = '';
            points.forEach((pt, index) => {
                const el = document.createElement('div');
                el.className = 'marker';
                el.style.left = `${pt.x}px`;
                el.style.top = `${pt.y}px`;
                el.title = pt.name;
                
                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    activeMarkerIndex = index;
                    document.getElementById('modal-title').innerText = "Dettagli / Modifica Tesoro";
                    document.getElementById('point-title').value = pt.name;
                    document.getElementById('point-desc').value = pt.desc || "";
                    document.getElementById('btn-delete').style.display = "block";
                    document.getElementById('marker-modal').style.display = "block";
                });

                markersLayer.appendChild(el);
            });
        }

        function saveMarker() {
            const name = document.getElementById('point-title').value.trim() || "Tesoro Senza Nome";
            const desc = document.getElementById('point-desc').value.trim();

            if (activeMarkerIndex !== null) {
                points[activeMarkerIndex].name = name;
                points[activeMarkerIndex].desc = desc;
            } else if (pendingClickPos) {
                points.push({
                    id: Date.now(),
                    x: pendingClickPos.x,
                    y: pendingClickPos.y,
                    name: name,
                    desc: desc
                });
            }

            localStorage.setItem('mappa_tesori_points', JSON.stringify(points));
            renderMarkers();
            closeModal();
        }

        function deleteCurrentMarker() {
            if (activeMarkerIndex !== null) {
                points.splice(activeMarkerIndex, 1);
                localStorage.setItem('mappa_tesori_points', JSON.stringify(points));
                renderMarkers();
                closeModal();
            }
        }

        function closeModal() {
            document.getElementById('marker-modal').style.display = "none";
            pendingClickPos = null;
            activeMarkerIndex = null;
        }
    </script>
</body>
</html>
